<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" stroke="#1A4A44" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
  <!-- island A (top-left): fully meshed -->
  <g>
    <path d="M40 40 L72 40 L72 72 L40 72 Z M40 40 L72 72 M72 40 L40 72"/>
  </g>
  <!-- island B (top-right) -->
  <g>
    <path d="M128 40 L160 40 L160 72 L128 72 Z M128 40 L160 72 M160 40 L128 72"/>
  </g>
  <!-- island C (bottom) -->
  <g>
    <path d="M84 126 L116 126 L116 158 L84 158 Z M84 126 L116 158 M116 126 L84 158"/>
  </g>
  <!-- occasional sync links between islands (dashed) -->
  <g stroke-dasharray="6 8" stroke-width="4" opacity="0.7">
    <path d="M72 56 L128 56"/>
    <path d="M56 72 L84 126"/>
    <path d="M144 72 L116 126"/>
  </g>
  <!-- chips as filled dots -->
  <g fill="#1A4A44" stroke="none">
    <circle cx="40" cy="40" r="7"/><circle cx="72" cy="40" r="7"/><circle cx="40" cy="72" r="7"/><circle cx="72" cy="72" r="7"/>
    <circle cx="128" cy="40" r="7"/><circle cx="160" cy="40" r="7"/><circle cx="128" cy="72" r="7"/><circle cx="160" cy="72" r="7"/>
    <circle cx="84" cy="126" r="7"/><circle cx="116" cy="126" r="7"/><circle cx="84" cy="158" r="7"/><circle cx="116" cy="158" r="7"/>
  </g>
</svg>
